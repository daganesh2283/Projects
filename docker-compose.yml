version: '3.8'

services:
  gditcc-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Optional: persist output graphs and reports on the host
      - ./outputs:/app/outputs
      # Optional: persist data uploaded on the host
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8000
